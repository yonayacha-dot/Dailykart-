<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DailyKart - SERVER CONNECTED</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{--orange:#FF6B00;--bg:#0A0A0A;--card:#161616;--card2:#1E1E1E;--border:#242424;--text:#fff}
body{background:var(--bg);color:var(--text);padding-bottom:120px;overflow-x:hidden}
.header{position:sticky;top:0;z-index:50;background:rgba(10,10,10,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}.logoIcon{width:38px;height:38px;background:var(--orange);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}
.logoText{font-weight:900;font-size:18px}.logoText span{color:var(--orange)}
.iconBtn{width:40px;height:40px;background:var(--card2);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.iconBtn.active{background:var(--orange);color:#000}
.badge{position:absolute;top:-4px;right:-4px;background:#FF3B30;color:#fff;font-size:9px;min-width:18px;height:18px;padding:0 5px;border-radius:100px;display:flex;align-items:center;justify-content:center;font-weight:800}
.searchWrap{padding:12px 14px;display:flex;gap:10px}.searchBox{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:100px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.searchBox input{flex:1;background:transparent;border:0;outline:none;color:var(--text);font-size:14px}
.slider{margin:12px 14px;height:164px;border-radius:24px;overflow:hidden;position:relative;background:var(--card2);border:1px solid var(--border)}
.slide{position:absolute;inset:0;opacity:0;transition:0.7s;display:flex}.slide.on{opacity:1}.slide img{width:100%;height:100%;object-fit:cover}
.slideGrad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.2) 70%);padding:20px;display:flex;flex-direction:column;justify-content:center}
.sec{padding:20px 14px 10px;display:flex;justify-content:space-between;align-items:center}.secTitle{font-weight:800;font-size:15px}
.hRow{display:flex;gap:12px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}
.pMini{min-width:156px;max-width:156px;background:#fff;color:#000;border-radius:22px;overflow:hidden;flex-shrink:0;border:1px solid #EEE;position:relative}
.pMini img{width:100%;height:108px;object-fit:cover}.pMiniBody{padding:10px}
.tag{position:absolute;top:8px;left:8px;background:var(--orange);color:#000;padding:4px 8px;border-radius:100px;font-size:9px;font-weight:800}
.catRow{display:flex;gap:14px;overflow-x:auto;padding:6px 14px 14px;scrollbar-width:none}
.cat{min-width:72px;text-align:center;cursor:pointer;opacity:0.6}.cat.on{opacity:1}.cat img{width:68px;height:68px;border-radius:22px;border:3px solid transparent;background:var(--card2);object-fit:cover}.cat.on img{border-color:var(--orange)}.cat p{font-size:10px;font-weight:700;margin-top:6px}
.grid{columns:2;column-gap:12px;padding:0 14px}.card{break-inside:avoid;background:#fff;color:#000;border-radius:22px;overflow:hidden;margin-bottom:12px;border:1px solid #EEE;position:relative}
.card img{width:100%;object-fit:cover}.card.big img{height:160px}.card.med img{height:124px}.card.small img{height:108px}
.cardBody{padding:11px}
.btnAdd{background:#0A0A0A;color:#fff;border:1.5px solid var(--orange);padding:7px 14px;border-radius:100px;font-weight:800;font-size:11px;cursor:pointer}
.qtyBox{background:var(--orange);color:#000;border-radius:100px;padding:6px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:12px}
.cartBar{position:fixed;bottom:82px;left:14px;right:14px;background:var(--orange);color:#000;border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:40;transform:translateY(150px);transition:0.4s}
.cartBar.show{transform:translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.mCard{background:#fff;color:#000;border-radius:28px 28px 0 0;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.inp{width:100%;background:#F5F5F7;border:1.5px solid #E9E9EB;border-radius:14px;padding:13px 14px;margin-top:10px;outline:none;font-size:14px;color:#000}
.btn{width:100%;background:var(--orange);color:#000;border:0;padding:15px;border-radius:100px;font-weight:800;font-size:14px;margin-top:12px;cursor:pointer}
.btnLine{width:100%;background:transparent;border:1.5px solid #E5E5E5;color:#000;padding:13px;border-radius:100px;font-weight:700;margin-top:8px;cursor:pointer}
.hidden{display:none!important}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:100px;font-weight:700;font-size:12px;z-index:999;opacity:0;transition:0.3s}
.toast.show{opacity:1}
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1E1E1E;border:1px solid var(--border);border-radius:100px;padding:6px;display:flex;gap:4px;z-index:30}
.navI{padding:10px 18px;border-radius:100px;font-size:11px;font-weight:700;color:#8A8A8A;cursor:pointer}
.navI.on{background:#fff;color:#000}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="welcome" class="modal" style="align-items:center;background:linear-gradient(135deg,#FF6B00,#FFB347)"><div style="text-align:center;color:#000;padding:24px;width:100%;max-width:380px"><img id="welImg" src="https://images.unsplash.com/photo-1526367790999-01539320d91e?w=600" style="width:100%;height:180px;object-fit:cover;border-radius:20px"><div style="font-size:38px;font-weight:900;margin-top:14px">DAILY<span style="color:#fff">KART</span></div><div style="font-weight:800;margin-top:6px;font-size:13px">SERVER CONNECTED - LIVE</div><button class="btn" style="background:#000;color:#fff;max-width:260px" onclick="welcome.style.display='none';localStorage.setItem('wel','1')">TAP TO ENTER</button></div></div>
<div class="header"><div class="logo" onclick="logoTap()"><div class="logoIcon">DK</div><div><div class="logoText">DAILY<span>KART</span></div><div style="font-size:10px;background:#1E1E1E;padding:2px 8px;border-radius:100px;display:inline-block" id="locT">Dirak Charali - LIVE</div></div></div><div style="display:flex;gap:8px"><div class="iconBtn active" onclick="openCart()"><span id="cBadge" class="badge">0</span>🛒</div></div></div>
<div class="searchWrap"><div class="searchBox"><input id="search" placeholder="Search live products..."></div></div>
<div class="slider" id="slider"></div>
<div class="sec"><div class="secTitle">Discount Offers - LIVE</div></div><div id="rDis" class="hRow"></div>
<div class="sec"><div class="secTitle">Shop by Category</div><span id="catLbl">All</span></div><div id="catRow" class="catRow"></div>
<div class="sec"><div class="secTitle">All Products - FROM SERVER</div><span id="cntLbl">0 items</span></div><div id="grid" class="grid"></div>
<div id="cartBar" class="cartBar"><div><b id="barC">0 items</b> • <span id="barT">Rs 0</span></div><button onclick="openCart()" style="background:#000;color:#fff;border:0;padding:10px 18px;border-radius:100px;font-weight:800">View Cart</button></div>
<div id="prodModal" class="hidden modal"><div class="mCard" id="prodBox"></div></div>
<div id="cartModal" class="hidden modal"><div class="mCard"><div style="display:flex;justify-content:space-between"><h3>Cart • <span id="cartCT">0</span></h3><span onclick="cartModal.classList.add('hidden')">✕</span></div><div id="cartItems" style="margin-top:12px"></div><div style="display:flex;justify-content:space-between;font-weight:900;margin-top:14px;font-size:18px"><span>Total</span><span id="grand">Rs 0</span></div><button class="btn" onclick="openCheckout()">Proceed to Checkout</button></div></div>
<div id="checkModal" class="hidden modal"><div class="mCard"><h3>Delivery Details</h3><input id="oName" class="inp" placeholder="Full Name"><input id="oPhone" class="inp" placeholder="Phone"><select id="oVill" class="inp"></select><input id="house" class="inp" placeholder="House No"><div style="display:flex;gap:10px;margin-top:16px"><button class="btnLine" style="flex:1" onclick="checkModal.classList.add('hidden')">Back</button><button class="btn" style="flex:1" onclick="placeOrder()">Confirm Order</button></div></div></div>
<div id="successModal" class="hidden modal" style="align-items:center"><div class="mCard" style="border-radius:28px;text-align:center"><h2>Order Placed!</h2><b id="sId">#1234</b> • <span id="sTotal">Rs 0</span><br><span id="sVill"></span><div style="font-size:28px;font-weight:900;color:#FF6B00;margin-top:10px" id="countdown">45:00</div><button class="btn" onclick="successModal.classList.add('hidden')">OK</button></div></div>
<div id="pages" class="hidden modal" style="align-items:center"><div class="mCard" style="border-radius:28px"><div id="pageBox"></div><button class="btnLine" onclick="pages.classList.add('hidden')">Close</button></div></div>
<div class="nav"><div class="navI on" onclick="goHome()">Home</div><div class="navI" onclick="openPage('orders')">Orders</div><div class="navI" onclick="location.href='admin.html'">Admin</div></div>
<script>
const areas=["Dirak Charali","Aamguri","Bordirak","Khatua","Hunjan","Navajyoti","Simoluguri","Uttar Bisrampur","Dakhin Bisrampur","Kailashpur","Dimbujora","Tongona","Gutibari","Tongona-Nagaon","Dirakgate","Modarkhat","Digholi-pothar","Huwonipothar","Namhullung","Tiniali Nagaon","Betoni","Wathoi","Litong","Talpothar","Hatigarh","Dumsi","Sitpani"];
let products=[], cats=[], banners=[], orders=[], wish=[], recent=[], cart=[], addrs=[];
let selCat='All', sIdx=0, curLoc=localStorage.getItem('curLoc')||'Dirak Charali';

async function loadFromServer(){
  try{
    let r = await fetch('/api/products');
    if(r.ok){ let d=await r.json(); if(d && d.length>0){ products=d; localStorage.setItem('dk_products_final', JSON.stringify(d)); } }
  }catch(e){}
  if(products.length==0){ products=JSON.parse(localStorage.getItem('dk_products_final')||'[]'); }
  if(products.length==0){ products=[{id:'1',name:'Chicken Burger',price:120,mrp:150,img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=500',category:'Fast Food',tag:'discount',delivery_time:'10 mins',size:'big',weight:'1 Pc',stock:5,rating:4.5}]; }
  try{ let r2=await fetch('/api/cats'); if(r2.ok){ cats=await r2.json(); } }catch(e){}
  if(cats.length==0){ cats=JSON.parse(localStorage.getItem('dk_cats_final')||'[]'); if(cats.length==0){ cats=[{name:'All',img:'https://dummyimage.com/200x200/FF6B00/000&text=ALL'},{name:'Fast Food',img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=200'}]; } }
  try{ let r3=await fetch('/api/banners'); if(r3.ok){ banners=await r3.json(); } }catch(e){}
  if(banners.length==0){ banners=JSON.parse(localStorage.getItem('dk_banners_final')||'[]'); if(banners.length==0){ banners=[{title:'45 MINS Delivery<br>27 Areas Fast',subtitle:'FIRST ORDER FREE',offer:'20% OFF CODE: FIRST20',image:'https://images.unsplash.com/photo-1526367790999-01539320d91e?w=800'}]; } }
  orders=JSON.parse(localStorage.getItem('dk_orders_final')||'[]'); cart=JSON.parse(localStorage.getItem('dk_cart')||'[]'); wish=JSON.parse(localStorage.getItem('dk_wish')||'[]'); recent=[]; addrs=JSON.parse(localStorage.getItem('dk_addrs')||'[]');
  initUI();
}
function initUI(){
  welImg.src=banners[0].image;
  slider.innerHTML=banners.map((b,i)=>`<div class="slide ${i==0?'on':''}"><img src="${b.image}"><div class="slideGrad"><div style="font-size:10px;color:#fff">${b.subtitle||''}</div><div style="font-size:22px;font-weight:900;color:#fff;margin-top:6px">${b.title}</div><div style="background:#FF6B00;color:#000;display:inline-block;padding:7px 14px;border-radius:100px;font-size:10px;font-weight:900;margin-top:12px">${b.offer||''}</div></div></div>`).join('');
  setInterval(()=>{sIdx=(sIdx+1)%banners.length;document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i==sIdx));},4000);
  oVill.innerHTML=areas.map(a=>`<option ${a==curLoc?'selected':''}>${a}</option>`).join('');
  render();
}
function render(){
  catRow.innerHTML=cats.map(c=>`<div class="cat ${selCat===c.name?'on':''}" onclick="selCat='${c.name}';render()"><img src="${c.img}"><p>${c.name}</p></div>`).join('');
  catLbl.innerText=selCat;
  let f=products.filter(p=>p.tag=='discount'); rDis.innerHTML=f.map(p=>mini(p)).join('');
  gridR(); barR();
}
function mini(p){let c=cart.find(x=>x.id==p.id);return `<div class="pMini"><span class="tag">${p.delivery_time}</span><img src="${p.img}" onclick="openP('${p.id}')"><div class="pMiniBody"><div style="font-size:12px;font-weight:800">${p.name}</div><div style="font-size:10px;color:#888">${p.weight} • Rs ${p.mrp}</div><div style="display:flex;justify-content:space-between;margin-top:8px"><b>Rs ${p.price}</b>${c?`<div class="qtyBox"><span onclick="dec('${p.id}')">−</span><span>${c.qty}</span><span onclick="inc('${p.id}')">+</span></div>`:`<button class="btnAdd" onclick="add('${p.id}')">Add</button>`}</div></div></div>`;}
function gridR(){let q=(search.value||'').toLowerCase();let list=products.filter(p=>(selCat=='All'||p.category==selCat)&&p.name.toLowerCase().includes(q));cntLbl.innerText=list.length+' items';grid.innerHTML=list.map(p=>{let c=cart.find(x=>x.id==p.id);return `<div class="card ${p.size}" onclick="openP('${p.id}')"><span class="tag">${p.delivery_time}</span><img src="${p.img}"><div class="cardBody"><div style="font-weight:800;font-size:13px">${p.name}</div><div style="font-size:10px;color:#888">${p.weight}</div><div style="display:flex;justify-content:space-between;margin-top:10px"><b>Rs ${p.price}</b><div onclick="event.stopPropagation()">${c?`<div class="qtyBox"><span onclick="dec('${p.id}')">−</span><span>${c.qty}</span><span onclick="inc('${p.id}')">+</span></div>`:`<button class="btnAdd" onclick="add('${p.id}')">+ Add</button>`}</div></div></div></div>`;}).join('');}
function add(id){let p=products.find(x=>x.id==id);let ex=cart.find(c=>c.id==id);if(ex)ex.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1});save();toastM(p.name+' added');}
function inc(id){cart.find(x=>x.id==id).qty++;save();}
function dec(id){let c=cart.find(x=>x.id==id);c.qty--;if(c.qty<=0)cart=cart.filter(x=>x.id!=id);save();}
function save(){localStorage.setItem('dk_cart',JSON.stringify(cart));render();if(!cartModal.classList.contains('hidden'))renderCart();}
function barR(){let tot=cart.reduce((a,b)=>a+b.price*b.qty,0),cnt=cart.reduce((a,b)=>a+b.qty,0);cBadge.innerText=cnt;if(cnt>0){cartBar.classList.add('show');barC.innerText=cnt+' items';barT.innerText='Rs '+tot;}else cartBar.classList.remove('show');}
function openCart(){if(cart.length==0)return toastM('Cart empty');renderCart();cartModal.classList.remove('hidden');}
function renderCart(){let sub=cart.reduce((a,b)=>a+b.price*b.qty,0);cartCT.innerText=cart.reduce((a,b)=>a+b.qty,0);cartItems.innerHTML=cart.map(c=>`<div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #EEE"><img src="${products.find(p=>p.id==c.id)?.img}" style="width:52px;height:52px;border-radius:14px"><div style="flex:1"><b>${c.name}</b><br>Rs ${c.price} x ${c.qty}</div><div class="qtyBox"><span onclick="dec('${c.id}')">−</span><span>${c.qty}</span><span onclick="inc('${c.id}')">+</span></div></div>`).join('');grand.innerText='Rs '+sub;}
function openP(id){let p=products.find(x=>x.id==id);prodBox.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>${p.name}</h3><span onclick="prodModal.classList.add('hidden')">✕</span></div><img src="${p.img}" style="width:100%;height:240px;object-fit:cover;border-radius:20px;margin-top:14px"><div style="margin-top:14px"><b style="font-size:22px">Rs ${p.price}</b> <span style="text-decoration:line-through;color:#999">Rs ${p.mrp}</span></div><button class="btn" onclick="add('${p.id}');prodModal.classList.add('hidden')">Add to Cart</button>`;prodModal.classList.remove('hidden');}
function toastM(m){let t=document.getElementById('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function openCheckout(){cartModal.classList.add('hidden');checkModal.classList.remove('hidden');}
function placeOrder(){if(!oName.value||!oPhone.value)return alert('Fill details');let tot=cart.reduce((a,b)=>a+b.price*b.qty,0);let o={id:Date.now().toString(),customer_name:oName.value,phone:oPhone.value,village:oVill.value,extra_address:house.value,items:cart,total:tot,status:'Placed',created_at:new Date().toLocaleString()};fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});orders.unshift(o);localStorage.setItem('dk_orders_final',JSON.stringify(orders));checkModal.classList.add('hidden');sId.innerText='#'+o.id.slice(-5);sTotal.innerText='Rs '+tot;sVill.innerText=o.village;successModal.classList.remove('hidden');cart=[];localStorage.setItem('dk_cart','[]');render();}
function openPage(p){let h='';if(p=='orders'){h=`<h3>My Orders</h3>`+orders.map(o=>`<div style="background:#F7F7F7;padding:14px;border-radius:18px;margin:12px 0"><b>#${o.id.slice(-5)} • Rs ${o.total}</b><br>${o.village}</div>`).join('');}pageBox.innerHTML=h;pages.classList.remove('hidden');}
function goHome(){pages.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'});}
function logoTap(){let t=parseInt(localStorage.getItem('lt')||'0')+1;localStorage.setItem('lt',t);if(t>=5)location.href='admin.html';setTimeout(()=>localStorage.setItem('lt','0'),3000);}
if(!localStorage.getItem('wel'))welcome.style.display='flex';else welcome.style.display='none';
search.addEventListener('input',()=>gridR());
loadFromServer();
</script>
</body>
</html>
