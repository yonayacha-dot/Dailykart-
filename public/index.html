<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyKart - LocalDelivery</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,sans-serif}.hide-scrollbar::-webkit-scrollbar{display:none}</style>
</head>
<body class="bg-[#f8f7f4]">
<header class="bg-white sticky top-0 z-30 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <img id="logoImg" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full">
      <div><h1 id="appName" class="font-extrabold text-xl">DailyKart</h1><p id="tagline" class="text-[11px] text-gray-500">LocalDelivery</p></div>
      <span id="shopStatus" class="ml-3 text-[10px] px-2 py-1 rounded-full bg-green-100">OPEN</span>
    </div>
    <div class="flex gap-2"><button onclick="openMyOrders()" class="p-2 bg-gray-100 rounded-full">📦</button><button onclick="openCart()" class="bg-black text-white px-5 py-2.5 rounded-full text-sm">Cart <span id="cartCount">0</span></button></div>
  </div>
  <div class="max-w-7xl mx-auto px-4 pb-3 flex gap-2">
    <input id="searchInput" oninput="renderAll()" placeholder="Search Biryani, Cement..." class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-sm outline-none">
    <select id="areaSelect" onchange="updateAreaInfo()" class="bg-black text-white rounded-full px-4 py-2.5 text-sm font-semibold"></select>
  </div>
  <div class="max-w-7xl mx-auto px-4 pb-2 text-[11px] text-gray-600"><span id="areaTime">⏱ 30 mins</span><span id="minOrderInfo"> | Min ₹200 else ₹30</span></div>
</header>
<div class="max-w-7xl mx-auto p-4"><div class="bg-black text-white rounded-[28px] p-6"><h2 id="bannerTitle" class="text-3xl font-extrabold">Daily Needs in 60 Mins</h2><p id="bannerSub" class="text-sm opacity-80 mt-2">Dirak to Sitpani</p></div></div>
<div class="max-w-7xl mx-auto px-4"><div id="catBar" class="flex gap-2 overflow-auto hide-scrollbar pb-2"></div></div>
<div class="max-w-7xl mx-auto px-4 mt-4 space-y-6">
  <div><h3 class="font-bold">🔥 Discount</h3><div id="sec-discount" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div></div>
  <div><h3 class="font-bold">⚡ Fast Delivery</h3><div id="sec-fast" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div></div>
  <div><h3 class="font-bold">❤️ Customer Fav</h3><div id="sec-fav" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div></div>
  <div><h3 class="font-bold">🆕 New</h3><div id="sec-new" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div></div>
  <div><h3 class="font-bold">🏆 Highest Ordered</h3><div id="sec-top" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div></div>
  <div><h3 class="font-bold">All Products</h3><div id="allGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3 pb-20"></div></div>
</div>
<div id="waFloat" class="fixed bottom-20 right-4 z-20 flex flex-col gap-2"></div>
<div id="cartModal" class="hidden fixed inset-0 bg-black/50 z-40"><div class="absolute bottom-0 w-full bg-white rounded-t-[28px] max-h-[92vh] flex flex-col"><div class="p-5 border-b flex justify-between"><h3 class="font-bold">Your Cart</h3><button onclick="closeCart()" class="bg-gray-100 w-8 h-8 rounded-full">✕</button></div><div id="cartItems" class="flex-1 overflow-auto p-5"></div><div class="p-5 border-t bg-gray-50"><div class="flex justify-between"><span>Subtotal</span><span id="subTotal">₹0</span></div><div class="flex justify-between"><span>Delivery</span><span id="delCharge">FREE</span></div><div class="flex justify-between font-bold"><span>Total</span><span id="grandTotal">₹0</span></div><p id="minWarn" class="text-xs text-red-500 hidden">Add ₹<span id="needMore"></span> more for FREE</p><div class="grid grid-cols-2 gap-2 mt-4"><input id="cName" placeholder="Full Name" class="border p-3 rounded-xl text-sm"><input id="cPhone" placeholder="Phone" class="border p-3 rounded-xl text-sm"><input id="cLandmark" placeholder="Landmark" class="col-span-2 border p-3 rounded-xl text-sm"><textarea id="cAddr" placeholder="Full Address" class="col-span-2 border p-3 rounded-xl text-sm"></textarea><select id="cPay" class="col-span-2 border p-3 rounded-xl text-sm"><option value="COD">COD</option><option value="UPI">UPI</option><option value="Wallet">Wallet</option></select><input id="couponInput" placeholder="Coupon MODARKHAT10" class="border p-3 rounded-xl text-sm"><button onclick="applyCoupon()" class="bg-gray-900 text-white rounded-xl text-sm">Apply</button></div><button onclick="placeOrder()" class="w-full bg-black text-white py-4 rounded-full mt-4 font-bold">Place Order + OTP</button></div></div></div>
<div id="ordersModal" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4"><div class="bg-white w-full max-w-lg rounded-[24px] max-h-[85vh] overflow-auto"><div class="p-5 border-b flex justify-between"><h3 class="font-bold">My Orders</h3><button onclick="document.getElementById('ordersModal').classList.add('hidden')" class="bg-gray-100 w-8 h-8 rounded-full">✕</button></div><div id="myOrdersList" class="p-5 space-y-3"></div></div></div>
<script>
const DEFAULT_AREAS=[{name:"Dirak Charali",time:"15 min",charge:0},{name:"Aamguri",time:"20 min",charge:0},{name:"Bordirak",time:"15 min",charge:0},{name:"Khatua",time:"20 min",charge:0},{name:"Hunjan",time:"10 min",charge:0},{name:"Navajyoti",time:"25 min",charge:0},{name:"Simoluguri",time:"30 min",charge:0},{name:"Uttar Bisrampur",time:"20 min",charge:0},{name:"Dakhin Bisrampur",time:"25 min",charge:0},{name:"Kailashpur",time:"10 min",charge:0},{name:"Dimbujora",time:"20 min",charge:0},{name:"Tongona",time:"15 min",charge:0},{name:"Gutibari",time:"15 min",charge:0},{name:"Tongona-Nagaon",time:"25 min",charge:0},{name:"Dirakgate",time:"10 min",charge:0},{name:"Modarkhat",time:"20 min",charge:0},{name:"Digholi-pothar",time:"35 min",charge:0},{name:"Huwonipothar",time:"40 min",charge:0},{name:"Namhullung",time:"30 min",charge:0},{name:"Tiniali Nagaon",time:"20 min",charge:0},{name:"Betoni",time:"25 min",charge:0},{name:"Wathoi",time:"30 min",charge:0},{name:"Litong",time:"35 min",charge:0},{name:"Talpothar",time:"60 min",charge:0},{name:"Hatigarh",time:"30 min",charge:0},{name:"Dumsi",time:"35 min",charge:0},{name:"Sitpani",time:"40 min",charge:0}];
const MOCK_PRODUCTS=[{_id:"p1",name:"Chicken Biryani Full",price:180,mrp:220,discount:18,stock:20,unit:"1 plate",category:"FastFood",highlight:"discount",image:"https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=400",fast:true},{_id:"p2",name:"Veg Fried Rice",price:120,mrp:150,discount:20,stock:15,unit:"1 plate",category:"FastFood",highlight:"fast",image:"https://images.unsplash.com/photo-1603133872875-ca2a98b0a498?w=400",fast:true},{_id:"p3",name:"Aata 5kg Fortune",price:280,mrp:320,discount:12,stock:50,unit:"5kg",category:"Grocery",highlight:"fav",image:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"},{_id:"p4",name:"Mustard Oil 1L",price:190,mrp:210,discount:10,stock:30,unit:"1L",category:"Grocery",highlight:"top",image:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400"},{_id:"p5",name:"Fresh Tomato",price:40,mrp:60,discount:33,stock:100,unit:"1kg",category:"Vegetables",highlight:"discount",image:"https://images.unsplash.com/photo-1561136594-7f68413baa64?w=400",fast:true},{_id:"p6",name:"Potato",price:30,mrp:40,discount:25,stock:200,unit:"1kg",category:"Vegetables",highlight:"top",image:"https://images.unsplash.com/photo-1518977676608-bd36c2ca4f9d?w=400"},{_id:"p7",name:"Cement Bag ACC",price:420,mrp:450,discount:6,stock:40,unit:"1 bag",category:"Hardware",highlight:"new",image:"https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=400"},{_id:"p8",name:"Hammer 500g",price:250,mrp:300,discount:16,stock:12,unit:"1pc",category:"Hardware",highlight:"fav",image:"https://images.unsplash.com/photo-1426927308491-6380b6a9936f?w=400"},{_id:"p9",name:"Surf Excel 1kg",price:180,mrp:200,discount:10,stock:25,unit:"1kg",category:"Daily Needs",highlight:"top",image:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=400"},{_id:"p10",name:"Colgate 150g",price:95,mrp:110,discount:13,stock:60,unit:"1pc",category:"Daily Needs",highlight:"new",image:"https://images.unsplash.com/photo-1607613009820-a29f7bb81c04?w=400"},{_id:"p11",name:"Mason - Full Day",price:800,mrp:800,discount:0,stock:5,unit:"1 day",category:"Work/workers",highlight:"fast",image:"https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=400"},{_id:"p12",name:"Electrician Visit",price:300,mrp:300,discount:0,stock:8,unit:"1 visit",category:"Work/workers",highlight:"fav",image:"https://images.unsplash.com/photo-1621905252507-b35492cc74b4?w=400"},{_id:"p13",name:"Egg Roll",price:60,mrp:80,discount:25,stock:50,unit:"1pc",category:"FastFood",highlight:"top",image:"https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=400",fast:true},{_id:"p14",name:"Onion 1kg",price:35,mrp:50,discount:30,stock:150,unit:"1kg",category:"Vegetables",highlight:"discount",image:"https://images.unsplash.com/photo-1518977956812-cd3dbadaaf31?w=400"},{_id:"p15",name:"Rice 10kg Kolam",price:550,mrp:650,discount:15,stock:30,unit:"10kg",category:"Grocery",highlight:"fav",image:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"},{_id:"p16",name:"PVC Pipe 1 inch",price:180,mrp:200,discount:10,stock:100,unit:"1m",category:"Hardware",highlight:"new",image:"https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=400"},{_id:"p17",name:"Dishwasher Labour",price:500,mrp:500,discount:0,stock:3,unit:"1 day",category:"Work/workers",highlight:"new",image:"https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=400"},{_id:"p18",name:"Maggi 12 pack",price:144,mrp:168,discount:14,stock:40,unit:"12pc",category:"Grocery",highlight:"top",image:"https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?w=400"},{_id:"p19",name:"Green Chilli",price:20,mrp:30,discount:33,stock:80,unit:"250g",category:"Vegetables",highlight:"fast",image:"https://images.unsplash.com/photo-1563565375-f3fdfdbefa83?w=400",fast:true},{_id:"p20",name:"Parle-G 1kg",price:100,mrp:120,discount:16,stock:70,unit:"1kg",category:"Daily Needs",highlight:"fav",image:"https://images.unsplash.com/photo-1543528172-cd0d7b2a0d0f?w=400"},{_id:"p21",name:"Chicken Curry Cut 1kg",price:280,mrp:320,discount:12,stock:15,unit:"1kg",category:"Grocery",highlight:"discount",image:"https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=400",fast:true},{_id:"p22",name:"Water Tank Cleaner",price:600,mrp:600,discount:0,stock:4,unit:"1 service",category:"Work/workers",highlight:"fast",image:"https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=400"},{_id:"p23",name:"Harpic",price:85,mrp:95,discount:10,stock:40,unit:"500ml",category:"Daily Needs",highlight:"new",image:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=400"},{_id:"p24",name:"Screw Driver Set",price:350,mrp:400,discount:12,stock:10,unit:"1 set",category:"Hardware",highlight:"top",image:"https://images.unsplash.com/photo-1530124566582-a618bc2615dc?w=400"}];
let CFG={},products=[],cart=[],activeCat='All',coupon=null;
async function init(){try{const r=await fetch('/api/config');CFG=await r.json();}catch{CFG={};} CFG.areas=CFG.areas&&CFG.areas.length?(typeof CFG.areas[0]==='string'?CFG.areas.map(n=>({name:n,time:"30 min",charge:0})):CFG.areas):DEFAULT_AREAS; CFG.appName=CFG.appName||'DailyKart- LocalDelivery'; CFG.tagline=CFG.tagline||'Dirak to Sitpani'; CFG.minOrder=CFG.minOrder||200; CFG.extraCharge=CFG.extraCharge||30; CFG.whatsapp=CFG.whatsapp||["91XXXXXXXXXX"]; document.getElementById('appName').innerText=CFG.appName; document.getElementById('tagline').innerText=CFG.tagline; document.getElementById('bannerTitle').innerText=CFG.bannerTitle||'Daily Needs in 60 Mins'; document.getElementById('bannerSub').innerText=CFG.bannerSubtitle||'27 Areas Covered'; document.getElementById('logoImg').src=CFG.logo||'https://via.placeholder.com/40'; document.getElementById('shopStatus').innerText=CFG.shopOff?'CLOSED':'OPEN'; document.getElementById('areaSelect').innerHTML=CFG.areas.map(a=>`<option>${a.name}</option>`).join(''); document.getElementById('waFloat').innerHTML=(Array.isArray(CFG.whatsapp)?CFG.whatsapp:[CFG.whatsapp]).map(n=>`<a href="https://wa.me/${n}?text=Hi DailyKart" target="_blank" class="bg-green-500 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg">W</a>`).join(''); updateAreaInfo(); loadProducts();}
function updateAreaInfo(){const sel=document.getElementById('areaSelect').value; const area=(CFG.areas||[]).find(a=>a.name===sel); if(area) document.getElementById('areaTime').innerText='⏱ Delivery: '+area.time; document.getElementById('minOrderInfo').innerText=`| Min ₹${CFG.minOrder} else ₹${CFG.extraCharge}`;}
async function loadProducts(){try{const r=await fetch('/api/products');const d=await r.json();products=Array.isArray(d)?d:d.products||[]; if(products.length<5) throw 0;}catch{products=MOCK_PRODUCTS;} renderCats(); renderAll();}
function renderCats(){const cats=['All','FastFood','Grocery','Vegetables','Hardware','Daily Needs','Work/workers']; document.getElementById('catBar').innerHTML=cats.map(c=>`<button onclick="setCat('${c}')" class="px-4 py-2 rounded-full text-sm whitespace-nowrap ${activeCat===c?'bg-black text-white':'bg-white border'}">${c}</button>`).join('');}
function setCat(c){activeCat=c; renderCats(); renderAll();}
function card(p){return `<div class="bg-white rounded-[18px] p-3 shadow-sm border"><div class="relative"><img src="${p.image}" class="h-28 w-full object-cover rounded-xl"><span class="absolute top-1 left-1 bg-black text-white text-[10px] px-2 py-0.5 rounded-full">${p.category}</span>${p.discount>0?`<span class="absolute top-1 right-1 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">${p.discount}% OFF</span>`:''}</div><h3 class="font-semibold mt-2 text-[13px]">${p.name}</h3><p class="text-[11px] text-gray-500">${p.unit} • ${p.stock>0?'<span class=text-green-600>Available</span>':'<span class=text-red-600>Out</span>'}</p><div class="flex gap-1 mt-1"><span class="font-bold text-sm">₹${p.price}</span><span class="text-[11px] line-through text-gray-400">₹${p.mrp||p.price}</span></div><div class="flex gap-1 mt-2"><button onclick="addCart('${p._id}',-1)" class="w-8 h-8 bg-gray-100 rounded-full">-</button><button onclick="addCart('${p._id}',1)" class="flex-1 bg-black text-white rounded-full text-xs">Add ${getQty(p._id)>0?'('+getQty(p._id)+')':''}</button><button onclick="addCart('${p._id}',1)" class="w-8 h-8 bg-gray-100 rounded-full">+</button></div></div>`;}
function getQty(id){const f=cart.find(c=>c._id===id); return f?f.qty:0;}
function renderAll(){const q=document.getElementById('searchInput').value.toLowerCase(); let list=products.filter(p=>(activeCat==='All'||p.category===activeCat)&&(p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))); document.getElementById('sec-discount').innerHTML=list.filter(p=>p.discount>=20).slice(0,4).map(card).join(''); document.getElementById('sec-fast').innerHTML=list.filter(p=>p.fast).slice(0,4).map(card).join(''); document.getElementById('sec-fav').innerHTML=list.filter(p=>p.highlight==='fav').slice(0,4).map(card).join(''); document.getElementById('sec-new').innerHTML=list.filter(p=>p.highlight==='new').slice(0,4).map(card).join(''); document.getElementById('sec-top').innerHTML=list.filter(p=>p.highlight==='top').slice(0,4).map(card).join(''); document.getElementById('allGrid').innerHTML=list.map(card).join('');}
function addCart(id,delta){const p=products.find(x=>x._id===id); if(!p||p.stock<=0) return; let ex=cart.find(x=>x._id===id); if(!ex&&delta>0) cart.push({...p,qty:1}); else if(ex){ex.qty+=delta; if(ex.qty<=0) cart=cart.filter(x=>x._id!==id);} document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0); renderAll(); renderCart();}
function renderCart(){document.getElementById('cartItems').innerHTML=cart.map(c=>`<div class="flex justify-between py-2 border-b"><div><p class="font-semibold text-sm">${c.name}</p><p class="text-xs">₹${c.price} x ${c.qty}</p></div><div class="flex gap-2"><button onclick="addCart('${c._id}',-1)" class="w-7 h-7 bg-gray-100 rounded-full">-</button><span>${c.qty}</span><button onclick="addCart('${c._id}',1)" class="w-7 h-7 bg-gray-100 rounded-full">+</button></div></div>`).join('')||'Cart khali'; const sub=cart.reduce((a,b)=>a+b.price*b.qty,0); let del=0; if(sub>0&&sub<CFG.minOrder) del=CFG.extraCharge; document.getElementById('subTotal').innerText='₹'+sub; document.getElementById('delCharge').innerText=del?'₹'+del:'FREE'; document.getElementById('grandTotal').innerText='₹'+(sub+del); document.getElementById('minWarn').classList.toggle('hidden',!(sub>0&&sub<CFG.minOrder)); document.getElementById('needMore').innerText=CFG.minOrder-sub;}
function openCart(){document.getElementById('cartModal').classList.remove('hidden'); renderCart();} function closeCart(){document.getElementById('cartModal').classList.add('hidden');}
function applyCoupon(){const code=document.getElementById('couponInput').value.toUpperCase(); const coupons=CFG.coupons||[{code:"MODARKHAT10",discount:10}]; const f=coupons.find(c=>c.code===code); if(f){coupon=f; alert(f.discount+'% OFF'); renderCart();} else alert('Invalid');}
async function placeOrder(){if(!cart.length) return alert('Cart khali'); const area=document.getElementById('areaSelect').value; const data={products:cart,totalAmount:parseInt(document.getElementById('grandTotal').innerText.replace('₹','')),area,landmark:cLandmark.value,address:cAddr.value,paymentMethod:cPay.value,phone:cPhone.value,customerName:cName.value,otp:Math.floor(1000+Math.random()*9000)}; try{await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});}catch{} const arr=JSON.parse(localStorage.getItem('dk_orders')||'[]'); arr.unshift({...data,status:"Pending",_id:Date.now(),createdAt:new Date().toISOString()}); localStorage.setItem('dk_orders',JSON.stringify(arr)); alert('Order Done OTP:'+data.otp); cart=[]; document.getElementById('cartCount').innerText=0; closeCart(); openMyOrders();}
function openMyOrders(){document.getElementById('ordersModal').classList.remove('hidden'); const orders=JSON.parse(localStorage.getItem('dk_orders')||'[]'); document.getElementById('myOrdersList').innerHTML=orders.map(o=>`<div class="border rounded-xl p-3"><div class="flex justify-between"><span class="font-bold">₹${o.totalAmount}</span><span class="text-xs bg-yellow-100 px-2 py-1 rounded">${o.status}</span></div><p class="text-xs">${o.area} • ${o.address}</p><p class="text-xs">OTP:${o.otp}</p></div>`).join('')||'No orders';}
init();
</script></body></html>
