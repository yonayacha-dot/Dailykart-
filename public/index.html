<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DailyKart - Tinsukia</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FF6A00">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Outfit,sans-serif}
body{background:#F8F7FF}.app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.top{background:#111;color:#fff;padding:14px;border-radius:0 0 20px 20px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.c{background:#fff;border-radius:18px;border:2px solid #eee;overflow:hidden;position:relative}
.c img{width:100%;height:115px;object-fit:cover;background:#FFE8CC;display:block}
.pad{padding:10px}.btn{width:100%;border:0;border-radius:999px;padding:11px;font-weight:800;cursor:pointer;background:#FF6A00;color:#fff;position:relative;z-index:10}
.btn:active{transform:scale(.95)}.input{width:100%;padding:12px;border-radius:12px;border:2px solid #ddd;margin-top:8px;font-weight:600;outline:none}
.catR{display:flex;gap:8px;overflow:auto;padding:10px}.cat{padding:8px 14px;border-radius:999px;background:#fff;border:2px solid #ddd;font-size:12px;white-space:nowrap;cursor:pointer}.cat.on{background:#111;color:#fff;border-color:#111}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:2px solid #eee;display:flex;padding:8px;gap:6px;border-radius:20px 20px 0 0}
.nav{flex:1;text-align:center;padding:8px;font-size:11px;font-weight:800;color:#888;border-radius:12px;cursor:pointer}.nav.on{background:#111;color:#fff}
.box{background:#fff;border:2px solid #eee;border-radius:16px;padding:12px;margin:10px}
.ad{grid-column:1/-1;background:linear-gradient(135deg,#111,#FF6A00);border-radius:18px;display:flex;overflow:hidden;border:2px solid #FF6A00}.ad img{width:45%;object-fit:cover}.adI{flex:1;padding:12px;color:#fff}
.qBtn{width:38px;height:38px;border-radius:999px;border:0;background:#111;color:#fff;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div style="width:38px;height:38px;background:#FF6A00;border-radius:10px;display:grid;place-items:center;font-weight:800">DK</div><div><b>DailyKart</b><div style="font-size:10px;opacity:.7">27 Areas • 30 Min</div></div></div><div style="display:flex;gap:8px;align-items:center"><span id="shop" style="background:#0ab15b;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800">OPEN</span><div onclick="go('cart')" style="background:rgba(255,255,255,.15);padding:8px 12px;border-radius:12px;cursor:pointer">🛒 <b id="cc">0</b></div></div></div>
<div id="home"><div style="margin:10px;background:linear-gradient(135deg,#FF6A00,#111);color:#fff;padding:14px;border-radius:16px"><b>🍊 Fast Delivery</b><div style="font-size:11px">Dirak to Sitpani • FREE above ₹299</div></div><div style="padding:0 10px;display:flex;gap:8px"><input id="sr" class="input" placeholder="Search..." style="margin:0"><select id="ar" class="input" style="margin:0"></select></div><div class="catR" id="cats"></div><div id="st" style="margin:10px;padding:10px;background:#FFF3E6;border-radius:12px;font-size:11px;font-weight:700">⏳ Loading...</div><div class="grid" id="grid"></div></div>
<div id="cartP" style="display:none"><div class="box"><h3>🛒 Cart - Qty + / -</h3></div><div id="cList"></div><div class="box"><div id="bill" style="font-size:13px"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="background:#fff;color:#111;border:2px solid #eee" onclick="go('home')">Shop More</button><button class="btn" style="background:#fff;color:#111;border:2px solid #eee" onclick="clearCart()">Clear</button></div></div><div class="box"><select id="cArea" class="input"></select><input id="cName" class="input" placeholder="Name *"><input id="cPhone" class="input" placeholder="Phone *"><textarea id="cAddr" class="input" placeholder="Address *"></textarea><button class="btn" id="place" style="margin-top:10px;padding:16px">✅ Order Now - WhatsApp</button></div></div>
<div id="ordersP" style="display:none"><div class="box"><h3>📦 Orders</h3></div><div id="oList" style="padding:0 10px;display:grid;gap:10px"></div></div>
<div class="bottom"><div class="nav on" id="nH" onclick="go('home')">🏠<br>Home</div><div class="nav" id="nC" onclick="go('cart')">🛒<br>Cart</div><div class="nav" id="nO" onclick="go('orders')">📦<br>Orders</div></div>
</div>
<script>
var cfg={apiKey:"AIzaSyDRRYLhHv2ecotfSRBfE2L9dElO1UeyFd4",authDomain:"dailykart-tinsukia.firebaseapp.com",databaseURL:"https://dailykart-tinsukia-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"dailykart-tinsukia",storageBucket:"dailykart-tinsukia.firebasestorage.app",messagingSenderId:"279043121985",appId:"1:279043121985:web:57a5c97b9a8827ad2e77c0"};
firebase.initializeApp(cfg); var db=firebase.database();
var AREAS=["Dirak Charali","Aamguri","Bordirak","Khatua","Hunjan","Navajyoti","Simoluguri","Uttar Bisrampur","Dakhin Bisrampur","Kailashpur","Dimbujora","Tongona","Gutibari","Tongona-Nagaon","Dirakgate","Modarkhat","Digholi-pothar","Huwonipothar","Namhullung","Tiniali Nagaon","Betoni","Wathoi","Litong","Talpothar","Hatigarh","Dumsi","Sitpani"];
var CATS=["All","Grocery","Vegetables / Fruits","FastFood/ Snacks","Hardware","Car / Bike Rent","Medicines"];
var FB=[{id:"p1",name:"Amul Milk 500ml",price:28,mrp:30,category:"Grocery",image:"https://images.unsplash.com/photo-1550583724-b2692b85b150?w=300",off:"20% OFF"},{id:"p2",name:"Tomato 1kg Fresh",price:40,mrp:60,category:"Vegetables / Fruits",image:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300",off:"FEATURED"},{id:"p3",name:"Lays Chips",price:20,mrp:20,category:"FastFood/ Snacks",image:"https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=300",off:"NEW"},{id:"p4",name:"Paracetamol",price:15,mrp:20,category:"Medicines",image:"https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=300",off:"FAV"},{id:"p5",name:"Hammer Tool",price:250,mrp:300,category:"Hardware",image:"https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=300",off:"BEST"}];
var PRODUCTS=FB.slice(),CART=[],ORDERS=[],CURC="All",SHOP=true,WA="918761958928",CURA=localStorage.getItem("dk_area")||AREAS[0];
function init(){
 CART=JSON.parse(localStorage.getItem("dk_cart")||"[]");
 document.getElementById("ar").innerHTML=AREAS.map(a=>`<option ${a==CURA?'selected':''}>${a}</option>`).join("");
 document.getElementById("cArea").innerHTML=AREAS.map(a=>`<option ${a==CURA?'selected':''}>${a}</option>`).join("");
 document.getElementById("cats").innerHTML=CATS.map(c=>`<div class="cat ${c==CURC?'on':''}" data-c="${c}">${c}</div>`).join("");
 db.ref("dk_v3_products").on("value",s=>{let v=s.val();if(v&&Object.values(v).length){PRODUCTS=Object.values(v);document.getElementById("st").innerHTML=`✅ ${PRODUCTS.length} products live`;document.getElementById("st").style.background="#e6fff1"}else{PRODUCTS=FB.slice();document.getElementById("st").innerHTML=`⚠️ ${FB.length} fallback - Add in Admin`}draw()});
 db.ref("dk_v3_settings").on("value",s=>{let v=s.val();if(v){SHOP=v.shopOpen!==false;WA=(v.whatsapp||WA).replace(/\+/g,"");document.getElementById("shop").textContent=SHOP?"OPEN":"CLOSED";document.getElementById("shop").style.background=SHOP?"#0ab15b":"#ef4444"}});
 db.ref("dk_v3_orders").on("value",s=>{let v=s.val();if(v)ORDERS=Object.values(v).sort((a,b)=>b.createdAt-a.createdAt);drawOrders()});
 draw();upd();
}
function draw(){
 let q=document.getElementById("sr").value.toLowerCase();
 let all=PRODUCTS.filter(p=>{if(CURC!="All"&&!(p.category||"").includes(CURC))return false;if(q&&!(p.name||"").toLowerCase().includes(q))return false;return true});
 let fav=all.filter(p=>(p.off||"").toLowerCase().includes("featured")||(p.off||"").toLowerCase().includes("fav")||p.isAd);
 let normal=all.filter(p=>!fav.includes(p));
 let h="";let ai=0;
 for(let i=0;i<normal.length;i++){let p=normal[i];h+=`<div class="c"><img src="${p.image}"><div class="pad"><b style="font-size:12px">${p.name}</b><div style="font-size:10px;color:#888">${p.category}</div><div><b style="color:#FF6A00">₹${p.price}</b></div><button onclick="buyNow('${p.id}')" class="btn" style="margin-top:8px">🛒 Buy</button></div></div>`;if((i+1)%3==0&&fav.length>0){let ad=fav[ai%fav.length];ai++;h+=`<div class="ad"><img src="${ad.image}"><div class="adI"><span style="background:#FF6A00;padding:3px 8px;border-radius:999px;font-size:10px">🔥 FAV</span><h3 style="margin-top:6px">${ad.name}</h3><div>₹${ad.price}</div><button onclick="buyNow('${ad.id}')" class="btn" style="margin-top:8px;background:#fff;color:#111">⚡ Buy Now - ₹${ad.price}</button></div></div>`}}
 if(normal.length==0&&fav.length>0){h=fav.map(ad=>`<div class="ad"><img src="${ad.image}"><div class="adI"><h3>${ad.name}</h3><div>₹${ad.price}</div><button onclick="buyNow('${ad.id}')" class="btn" style="margin-top:8px;background:#fff;color:#111">⚡ Buy Now</button></div></div>`).join("")}
 if(all.length==0)h='<div class="box" style="grid-column:1/-1">No products</div>';
 document.getElementById("grid").innerHTML=h;
}
window.buyNow=function(id){if(!SHOP)return alert("Shop Closed");let p=PRODUCTS.find(x=>String(x.id)==String(id));if(!p)return alert("Not found "+id);let ex=CART.find(x=>String(x.id)==String(id));if(!ex)CART.push({id:p.id,name:p.name,price:p.price,qty:1,image:p.image});else ex.qty++;upd();drawCart();go('cart')};
function upd(){let t=0;CART.forEach(c=>t+=c.qty);document.getElementById("cc").textContent=t;localStorage.setItem("dk_cart",JSON.stringify(CART));localStorage.setItem("dk_area",CURA)}
function drawCart(){let sub=0;CART.forEach(c=>sub+=c.price*c.qty);document.getElementById("cList").innerHTML=CART.length?CART.map(c=>`<div class="box" style="display:flex;gap:10px"><img src="${c.image}" style="width:60px;height:60px;border-radius:10px;object-fit:cover"><div style="flex:1"><b>${c.name}</b><div>₹${c.price} x ${c.qty}</div><div style="display:flex;gap:6px;margin-top:6px"><button class="qBtn" onclick="qty('${c.id}',-1)">-</button><span style="padding:6px 12px;background:#FFF3E6;border-radius:999px">${c.qty}</span><button class="qBtn" onclick="qty('${c.id}',1)">+</button><button class="qBtn" onclick="qty('${c.id}',-999)" style="background:#fee2e2;color:#b91c1c">X</button></div></div></div>`).join(""):'<div class="box">Cart empty</div>';document.getElementById("bill").innerHTML=`<b>Total: ₹${sub}</b>`;document.getElementById("place").textContent=`✅ Order Now - ₹${sub}`}
window.qty=function(id,d){let ex=CART.find(x=>String(x.id)==String(id));if(d==-999)CART=CART.filter(x=>String(x.id)!=String(id));else if(ex){ex.qty+=d;if(ex.qty<=0)CART=CART.filter(x=>String(x.id)!=String(id))}upd();drawCart()}
window.clearCart=function(){CART=[];upd();drawCart()}
function drawOrders(){let el=document.getElementById("oList");if(!el)return;if(!ORDERS.length){el.innerHTML='<div class="box">No orders</div>';return}el.innerHTML=ORDERS.map(o=>`<div class="box" style="border-left:4px solid #FF6A00"><b>#${o.orderId}</b> ${o.status}<div>₹${o.grandTotal} OTP ${o.otp}</div></div>`).join("")}
window.go=function(t){document.getElementById("home").style.display=t=='home'?'block':'none';document.getElementById("cartP").style.display=t=='cart'?'block':'none';document.getElementById("ordersP").style.display=t=='orders'?'block':'none';document.querySelectorAll(".nav").forEach(n=>n.classList.remove("on"));document.getElementById({home:"nH",cart:"nC",orders:"nO"}[t]).classList.add("on");if(t=='cart')drawCart();if(t=='orders')drawOrders();window.scrollTo(0,0)}
document.addEventListener("click",e=>{if(e.target.closest(".cat")){let c=e.target.closest(".cat");CURC=c.dataset.c;document.querySelectorAll(".cat").forEach(x=>x.classList.remove("on"));c.classList.add("on");draw()} if(e.target.closest("#place")){let name=document.getElementById("cName").value;let phone=document.getElementById("cPhone").value;let addr=document.getElementById("cAddr").value;if(!name||!phone||!addr)return alert("Name Phone Address");if(!CART.length)return alert("Cart empty");let sub=CART.reduce((a,b)=>a+b.price*b.qty,0);let otp=Math.floor(1000+Math.random()*9000);let oid="DK"+Date.now().toString().slice(-6);db.ref("dk_v3_orders/"+oid).set({orderId:oid,grandTotal:sub,otp,status:"pending",createdAt:Date.now(),items:CART}).then(()=>{window.open(`https://wa.me/${WA}?text=${encodeURIComponent(`NEW ORDER ${oid} ${name} ${phone} ₹${sub} OTP ${otp}`)}`,"_blank");CART=[];upd();drawCart();alert("OTP: "+otp);go('orders')})}});
document.addEventListener("DOMContentLoaded",()=>{init();document.getElementById("sr").addEventListener("input",draw);document.getElementById("ar").addEventListener("change",e=>{CURA=e.target.value;localStorage.setItem("dk_area",CURA)}); if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}})
</script>
</body>
</html>
