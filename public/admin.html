<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyKart Pro Admin - Server Sync</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{--orange:#FF6B00;--bg:#0A0A0A;--card:#151515;--card2:#1E1E1E;--border:#2A2A2A;--text:#fff;--muted:#8A8A8A}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.side{width:260px;background:var(--card);border-right:1px solid var(--border);padding:18px;position:fixed;height:100vh;overflow:auto}
.main{margin-left:260px;flex:1;padding:20px;background:var(--bg)}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:18px}.logoI{width:38px;height:38px;background:var(--orange);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.navI{padding:11px 12px;border-radius:12px;display:flex;gap:9px;align-items:center;font-weight:700;font-size:12px;cursor:pointer;margin-bottom:4px;color:var(--muted)}
.navI.on{background:var(--orange);color:#000}.card{background:var(--card2);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
.inp{width:100%;background:#0A0A0A;border:1.5px solid var(--border);border-radius:12px;padding:11px;color:#fff;margin-top:8px;outline:none;font-size:13px}
.btn{background:var(--orange);color:#000;border:0;padding:11px 16px;border-radius:100px;font-weight:800;cursor:pointer;margin-top:8px}
.btnLine{background:transparent;border:1.5px solid var(--border);color:#fff;padding:9px 14px;border-radius:100px;font-weight:700;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.gItem{border-radius:14px;overflow:hidden;border:2px solid transparent;cursor:pointer;position:relative;background:#000}.gItem.on{border-color:var(--orange)}.gItem img{width:100%;height:90px;object-fit:cover;display:block}
.gItem span{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.8));color:#fff;font-size:9px;padding:5px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:90;display:flex;align-items:center;justify-content:center;padding:12px}
.mCard{background:var(--card2);border:1px solid var(--border);border-radius:22px;padding:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse}th{font-size:10px;color:var(--muted);text-align:left;padding:8px}td{padding:10px 8px;border-top:1px solid var(--border);font-size:13px}
@media(max-width:900px){.side{width:100%;height:auto;position:relative}.main{margin-left:0}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" style="position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px">
<div class="card" style="width:100%;max-width:360px;text-align:center"><div style="font-size:26px;font-weight:900">DAILYKART <span style="color:var(--orange)">PRO</span></div><div style="font-size:10px;color:var(--muted);letter-spacing:1px">SERVER SYNC ADMIN</div>
<input id="lUser" class="inp" placeholder="admin"><input id="lPass" type="password" class="inp" placeholder="admin123">
<button class="btn" style="width:100%" onclick="doLogin()">Login</button></div>
</div>
<div id="gModal" class="hidden modal"><div class="mCard"><div style="display:flex;justify-content:space-between"><h3>Image Gallery Picker</h3><span onclick="gModal.classList.add('hidden')" style="cursor:pointer">✕</span></div>
<div class="card" style="margin-top:10px"><b style="font-size:12px">1. Upload</b><input type="file" id="fileInp" accept="image/*" class="inp" onchange="uploadImg(this)"></div>
<div class="card"><b style="font-size:12px">2. URL</b><div style="display:flex;gap:8px"><input id="urlInp" class="inp" style="margin:0" placeholder="https://..."><button class="btn" style="margin:0" onclick="addUrl()">Add</button></div></div>
<div class="card"><b style="font-size:12px">3. Select</b><div id="galGrid" class="gallery"></div></div>
</div></div>
<div class="side">
<div class="logo"><div class="logoI">DK</div><div><b>DAILY</b><span style="color:var(--orange)">KART</span><div style="font-size:10px;color:var(--muted)">Server Sync v4</div></div></div>
<div style="padding:10px;background:var(--card2);border-radius:12px;margin:12px 0"><div style="font-size:10px;color:var(--muted)">Logged as</div><b id="roleL" style="color:var(--orange)">Admin</b> • <span id="userL" style="font-size:12px">admin</span><br><button onclick="logout()" style="background:none;border:0;color:var(--muted);font-size:11px;text-decoration:underline;cursor:pointer;margin-top:4px">Logout</button></div>
<div id="sideNav"></div>
<div style="margin-top:14px;padding:10px;background:#FF6B0020;border:1px solid var(--orange);border-radius:12px"><div style="font-size:11px;font-weight:800">Gallery: <span id="galCount">0</span> | Products: <span id="pCount">0</span></div><div style="font-size:10px;color:var(--muted)" id="stat">Server Sync ON</div><button class="btn" style="width:100%;padding:7px;font-size:11px;margin-top:6px" onclick="window.open('/','_blank')">View Live Site</button></div>
</div>
<div class="main">
<div id="dash"></div><div id="products" class="hidden"></div><div id="cats" class="hidden"></div><div id="banners" class="hidden"></div><div id="orders" class="hidden"></div><div id="riders" class="hidden"></div><div id="staff" class="hidden"></div><div id="galleryTab" class="hidden"></div><div id="settings" class="hidden"></div>
</div>
<script>
let curTarget=null, role=localStorage.getItem('dk_role')||'', user=localStorage.getItem('dk_user')||'';
function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function set(k,v){localStorage.setItem(k,JSON.stringify(v)); upd()}
function ensure(key,def){let v=get(key); if(!v){ set(key,def); return def;} return v;}
let gallery=ensure('dk_gallery',[]); let products=ensure('dk_products_final',[]); let cats=ensure('dk_cats_final',[]); let banners=ensure('dk_banners_final',[]); let orders=ensure('dk_orders_final',[]), riders=ensure('dk_riders',[]), staffs=ensure('dk_staff',[{id:'1',name:'Admin',user:'admin',pass:'admin123',role:'Admin'}]);

async function syncFromServer(){
  try{
    let res = await fetch('/api/products');
    if(res.ok){
      let data = await res.json();
      set('dk_products_final', data);
      products = data;
      upd();
    }
  }catch(e){}
}
function doLogin(){let u=lUser.value.trim().toLowerCase(), p=lPass.value.trim(); staffs=get('dk_staff'); let f=staffs.find(s=>s.user.toLowerCase()==u && s.pass==p); if(!f){alert('Login Failed! admin/admin123'); return;} role=f.role; user=f.user; localStorage.setItem('dk_role',role); localStorage.setItem('dk_user',user); document.getElementById('login').style.display='none'; init();}
function logout(){localStorage.removeItem('dk_role'); location.reload();}
function init(){let navs=[['dash','Dashboard'],['products','Products'],['cats','Categories'],['banners','Banners'],['galleryTab','Gallery'],['orders','Orders'],['riders','Riders'],['staff','Staff'],['settings','Settings']]; sideNav.innerHTML=navs.map(([id,l],i)=>`<div class="navI ${i==0?'on':''}" onclick="openTab('${id}')">${l}</div>`).join(''); roleL.innerText=role; userL.innerText=user; openTab(navs[0][0]); upd(); if(role) login.style.display='none'; syncFromServer();}
function openTab(id){document.querySelectorAll('.main > div').forEach(d=>d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); document.querySelectorAll('.navI').forEach(n=>n.classList.remove('on')); render(id);}
function render(id){
if(id=='dash'){let tot=orders.reduce((a,b)=>a+b.total,0); dash.innerHTML=`<h2>Dashboard - ${role}</h2><div class="grid2" style="margin-top:12px"><div class="card"><div style="font-size:10px;color:var(--muted)">ORDERS</div><b>${orders.length}</b></div><div class="card"><div style="font-size:10px;color:var(--muted)">REVENUE</div><b>Rs ${tot}</b></div></div><div class="card"><b>Server: </b><span id="srvStatus">Checking...</span><br><button class="btn" onclick="syncFromServer()">🔄 Sync</button></div>`; fetch('/api/health').then(r=>r.json()).then(d=>{document.getElementById('srvStatus').innerText=`Live - ${d.products} products`;}).catch(()=>{document.getElementById('srvStatus').innerText='Offline';});}
if(id=='products'){products=get('dk_products_final'); document.getElementById('products').innerHTML=`<div style="display:flex;justify-content:space-between"><h2>Products - Server Sync ON</h2><button class="btn" onclick="addProd()">+ Add</button></div><div id="prodForm" class="card hidden"></div><div class="card" style="margin-top:12px"><table><tr><th>Img</th><th>Name</th><th>Price</th><th>Action</th></tr>${products.map((p,i)=>`<tr><td><img src="${p.img}" style="width:44px;height:44px;border-radius:10px"></td><td><b>${p.name}</b><br><span style="font-size:11px;color:var(--muted)">${p.category}</span></td><td>Rs ${p.price}</td><td><button class="btnLine" onclick="editProd(${i})">Edit</button> <button class="btnLine" style="color:#FF3B30" onclick="delProd(${i})">Del</button></td></tr>`).join('')}</table></div>`;}
if(id=='galleryTab'){gallery=get('dk_gallery'); document.getElementById('galleryTab').innerHTML=`<div style="display:flex;justify-content:space-between"><h2>Gallery</h2><button class="btn" onclick="gModal.classList.remove('hidden');renderGal()">+ Add</button></div><div class="card" style="margin-top:12px"><div class="gallery">${gallery.map((g,i)=>`<div class="gItem"><img src="${g.url}"><span>${g.name}</span><button onclick="delGal(${i})" style="position:absolute;top:4px;right:4px;background:#FF3B30;color:#fff;border:0;border-radius:50%;width:20px;height:20px">✕</button></div>`).join('')}</div></div>`;}
if(id=='settings'){document.getElementById('settings').innerHTML=`<h2>Settings</h2><div class="card"><button class="btn" onclick="syncFromServer()">Force Sync From Server</button></div>`;}
}
function renderGal(){gallery=get('dk_gallery'); galGrid.innerHTML=gallery.map(g=>`<div class="gItem" onclick="selectGal('${g.url}')"><img src="${g.url}"><span>${g.name}</span></div>`).join('');}
function pickImg(id){curTarget=id; gModal.classList.remove('hidden'); renderGal();}
function selectGal(url){if(curTarget){document.getElementById(curTarget).value=url; let pv=document.getElementById('pPreview'); if(pv)pv.innerHTML=`<img src="${url}" style="width:100px;height:100px;border-radius:14px">`; gModal.classList.add('hidden');}}
function uploadImg(inp){let f=inp.files[0]; if(!f)return; let r=new FileReader(); r.onload=e=>{let url=e.target.result; gallery=get('dk_gallery'); gallery.push({id:Date.now().toString(),url:url,name:f.name.slice(0,12)}); set('dk_gallery',gallery); if(curTarget)document.getElementById(curTarget).value=url; renderGal();}; r.readAsDataURL(f);}
function addUrl(){let u=urlInp.value.trim(); if(!u)return; gallery=get('dk_gallery'); gallery.push({id:Date.now().toString(),url:u,name:'URL'}); set('dk_gallery',gallery); urlInp.value=''; if(curTarget)document.getElementById(curTarget).value=u; renderGal();}
function delGal(i){if(confirm('Delete?')){gallery=get('dk_gallery'); gallery.splice(i,1); set('dk_gallery',gallery); render('galleryTab'); renderGal();}}
function addProd(edit=null){
 let list=get('dk_products_final')||[];
 let p=edit!==null?list[edit]:{name:'',price:'',mrp:'',category:'Fast Food',weight:'1 Pc',tag:'discount',delivery_time:'10 mins',stock:10,img:''};
 let form=document.getElementById('prodForm');
 form.classList.remove('hidden');
 form.innerHTML=`<h3>${edit!==null?'Edit':'Add'} Product</h3><div class="grid2"><input id="pName" class="inp" placeholder="Name" value="${p.name}"><input id="pPrice" class="inp" type="number" placeholder="Price" value="${p.price}"><input id="pMrp" class="inp" type="number" placeholder="MRP" value="${p.mrp}"><input id="pCat" class="inp" placeholder="Category" value="${p.category}"><input id="pWeight" class="inp" placeholder="Weight" value="${p.weight}"><input id="pTag" class="inp" placeholder="Tag" value="${p.tag}"><input id="pTime" class="inp" placeholder="Delivery" value="${p.delivery_time}"><input id="pStock" class="inp" type="number" placeholder="Stock" value="${p.stock}"></div><div style="margin-top:10px"><div style="display:flex;gap:6px"><input id="pImg" class="inp" style="margin:0;flex:1" placeholder="Image URL" value="${p.img}"><button class="btn" style="margin:0" type="button" onclick="pickImg('pImg')">Gallery</button></div><div id="pPreview" style="margin-top:8px">${p.img?`<img src="${p.img}" style="width:100px;height:100px;border-radius:14px">`:''}</div></div><div style="margin-top:10px"><button class="btn" onclick="saveProd(${edit!==null?edit:'null'})">${edit!==null?'Update':'Add'}</button> <button class="btnLine" onclick="document.getElementById('prodForm').classList.add('hidden')">Cancel</button></div>`;
}
function editProd(i){addProd(i);}
async function saveProd(idx){
 let name=document.getElementById('pName').value.trim();
 let img=document.getElementById('pImg').value.trim();
 if(!name||!img){ alert('Name + Image lage!'); return; }
 let list=get('dk_products_final')||[];
 let idToUse = (idx!=='null' && idx!==null && list[idx])? list[idx].id : Date.now().toString();
 let obj={id:idToUse,name,price:parseInt(document.getElementById('pPrice').value)||99,mrp:parseInt(document.getElementById('pMrp').value)||149,category:document.getElementById('pCat').value||'Fast Food',weight:document.getElementById('pWeight').value||'1 Pc',tag:document.getElementById('pTag').value||'new',delivery_time:document.getElementById('pTime').value||'10 mins',stock:parseInt(document.getElementById('pStock').value)||10,img,size:'med',veg:true,rating:4.5};
 if(idx!=='null' && idx!==null && idx>=0){ list[idx]=obj; } else { list.unshift(obj); }
 set('dk_products_final',list);
 try{
   let res = await fetch('/api/products', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj) });
   if(res.ok){ let d=await res.json(); set('dk_products_final', d.data||list); toast('✅ Server t live - Customer page t show hobo!'); } else toast('Local saved');
 }catch(e){ toast('Local saved - Server offline'); }
 document.getElementById('prodForm').classList.add('hidden');
 render('products');
}
async function delProd(i){ if(!confirm('Delete?')) return; let l=get('dk_products_final'); let id=l[i]?.id; l.splice(i,1); set('dk_products_final',l); try{ if(id) await fetch('/api/products/'+id,{method:'DELETE'}); }catch(e){} render('products'); }
function toast(m){let t=document.createElement('div'); t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#FF6B00;color:#000;padding:10px 18px;border-radius:100px;font-weight:800;z-index:999;font-size:12px'; t.innerText=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2500);}
function upd(){let p=get('dk_products_final'); let g=get('dk_gallery'); if(p)document.getElementById('pCount').innerText=p.length; if(g)document.getElementById('galCount').innerText=g.length;}
if(role)init(); else document.getElementById('login').style.display='flex';
</script>
</body>
</html>
